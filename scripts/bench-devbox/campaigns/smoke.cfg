# shellcheck shell=bash
# shellcheck disable=SC2034  # keys are read by campaign.sh after sourcing
#
# Correctness smoke for campaign.sh. It checks that the runner works
# end-to-end on any machine. It is not a measurement: one run, minimal
# iteration counts, and a capped hot ingest.
#
# The fixture dataset kind needs no network access. The runner generates the
# raw pack with `bench-ingest fixture --chunk 0 --num-ledgers 10000`
# (location is the per-chunk ledger count), then one untimed cold ingest
# freezes it into $BENCH/golden/smoke10k/. The count must cover the whole
# chunk: the cold freeze streams the full 10,000-ledger range and rejects a
# partial pack. HOT_NUM_LEDGERS caps the hot ingest at 2000 ledgers to keep
# the smoke short.
#
# Run it with a writable BENCH root:
#   BENCH=/tmp/bench ./scripts/bench-devbox/campaign.sh \
#       scripts/bench-devbox/campaigns/smoke.cfg

NAME=smoke
INGEST=both
QUERY=yes
RUNS=1
QC=1,4
COLD_ITERS=5
HOT_ITERS=10
HOT_NUM_LEDGERS=2000
DATASETS=(
  "smoke10k|fixture|10000|0"
)
