# shellcheck shell=bash
# shellcheck disable=SC2034  # keys are read by campaign.sh after sourcing
#
# Phase-1 min-spec campaign: cold + hot ingest on the m6id.2xlarge devbox
# (user-dev-063a), one chunk per profile, no queries. Answers "what do
# phase-1 cold and hot ingest cost on min-spec hardware?" in one window.
#
# Cold ingest is unpaced (catch-up throughput) and consumes whole
# 10,000-ledger chunks — bench-ingest cold has no partial-chunk flag, so one
# chunk is the floor. Hot ingest is paced at the phase-1 close interval and
# costs ~ledgers x 2s: 3 profiles x 1 run x 10,000 ledgers ~= 16.7h, plus
# the (unpaced) cold legs and fetch/build. Set HOT_NUM_LEDGERS (e.g. 8500)
# to shorten the hot legs; the cold legs stay full-chunk regardless.
#
# Chunk 1 for every profile: it is the only frozen sac-6000 chunk, and using
# the same positional block everywhere keeps the profiles comparable. Chunk
# IDs in the frozen packs are 1-based.

NAME=phase1-synthetic-minspec
INGEST=both
QUERY=no
CLOSE_INTERVAL=2s
RUNS=1
DATASETS=(
  "sac-6000|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/sac-6000/packs/cold|1"
  "custom_token-4000|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/custom_token-4000/packs/cold|1"
  "soroswap-1500|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/soroswap-1500/packs/cold|1"
)
