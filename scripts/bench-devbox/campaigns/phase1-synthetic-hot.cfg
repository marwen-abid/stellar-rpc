# shellcheck shell=bash
# shellcheck disable=SC2034  # keys are read by campaign.sh after sourcing
#
# Phase-1 hot-ingest campaign: one chunk per profile, paced at the phase-1
# close interval, no queries. Answers the steady-state question ("does hot
# ingest keep up at 2s closes?") across all three profiles in one overnight
# window.
#
# Wall clock: a paced run sleeps out the close interval per ledger, so a run
# costs ~ledgers x 2s. 3 profiles x 1 run x 8,500 ledgers ~= 14.2h plus
# fetch/build. Delete HOT_NUM_LEDGERS to pace full 10,000-ledger chunks
# (~16.7h total).
#
# Chunk 1 for every profile: it is the only frozen sac-6000 chunk, and using
# the same positional block everywhere keeps the profiles comparable. Chunk
# IDs in the frozen packs are 1-based.

NAME=phase1-synthetic-hot
INGEST=hot
QUERY=no
CLOSE_INTERVAL=2s
RUNS=1
HOT_NUM_LEDGERS=8500
DATASETS=(
  "sac-6000|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/sac-6000/packs/cold|1"
  "custom_token-4000|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/custom_token-4000/packs/cold|1"
  "soroswap-1500|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/soroswap-1500/packs/cold|1"
)
