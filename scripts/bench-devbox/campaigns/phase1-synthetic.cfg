# shellcheck shell=bash
# shellcheck disable=SC2034  # keys are read by campaign.sh after sourcing
#
# Phase-1 synthetic apply-load campaign. Three synthetic 20,000-ledger
# datasets, fetched once from GCS into $BENCH/golden/<name>/. Cold and hot
# ingest plus both query suites; hot ingest is paced at a 2s close interval
# (phase-1 cadence).
#
# The gs:// pack trees must exist before this campaign runs. Freezing the
# synthetic ledgers into cold packs is a separate manual step (PR #760
# tooling), not part of this runner. Chunk IDs in the frozen packs are
# 1-based (the freeze tooling rejects chunk 0).
#
# sac-6000 was generated to seq 11,008 only, so it has a single frozen
# chunk (chunk 1); its entry benchmarks that chunk alone.

NAME=phase1-synthetic
INGEST=both
QUERY=yes
CLOSE_INTERVAL=2s
RUNS=5
QC=1,4,16
COLD_ITERS=100
HOT_ITERS=200
DATASETS=(
  "sac-6000|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/sac-6000/packs/cold|1"
  "custom_token-4000|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/custom_token-4000/packs/cold|1 2"
  "soroswap-1500|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/soroswap-1500/packs/cold|1 2"
)
