# shellcheck shell=bash
# shellcheck disable=SC2034  # keys are read by campaign.sh after sourcing
#
# Phase-1 synthetic apply-load campaign. Three synthetic 20,000-ledger
# datasets, fetched once from GCS into $BENCH/golden/<name>/. Cold and hot
# ingest plus both query suites; hot ingest is paced at a 2s close interval
# (phase-1 cadence).
#
# The gs:// pack trees must exist before this campaign runs. Freezing the
# synthetic ledgers into cold packs is a separate manual step (PR #760
# tooling), not part of this runner.
#
# sac-6000 has one full chunk only (chunk 1 is partial), so its entry
# benchmarks chunk 0 alone.

NAME=phase1-synthetic
INGEST=both
QUERY=yes
CLOSE_INTERVAL=2s
RUNS=5
QC=1,4,16
COLD_ITERS=100
HOT_ITERS=200
DATASETS=(
  "sac-6000|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/sac-6000/packs/cold|0"
  "custom_token-4000|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/custom_token-4000/packs/cold|0 1"
  "soroswap-1500|packs-gs|gs://rpc-full-history/synthetic-ledgers/2026-07-18-apply-load-20k/soroswap-1500/packs/cold|0 1"
)
