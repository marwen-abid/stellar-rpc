name: Await campaign result
description: Poll S3 for the campaign result object for one relay window
inputs:
  role_arn:        {description: AWS role to assume via OIDC, required: true}
  region:          {description: AWS region containing the campaign, required: true}
  instance_id:     {description: Campaign EC2 instance ID, required: true}
  deadline_epoch:  {description: Campaign deadline as a Unix epoch, required: true}
outputs:
  state:
    description: ok | fail | running (empty when the relay itself failed)
    value: ${{ steps.relay.outputs.state }}
runs:
  using: composite
  steps:
    # The caller must check out the repo for this relative action and go run.
    - uses: ./.github/actions/setup-go
    - name: Configure AWS via OIDC
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.role_arn }}
        aws-region: ${{ inputs.region }}
        role-duration-seconds: 21600
    # RUN_ID must match the box preamble so other attempts' objects are ignored.
    # The relay exits 0 for every state; the caller's gate decides the verdict.
    - name: Relay
      id: relay
      shell: bash
      env:
        INSTANCE_ID: ${{ inputs.instance_id }}
        DEADLINE_EPOCH: ${{ inputs.deadline_epoch }}
        RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        WINDOW_SECONDS: 19200
        POLL_INTERVAL: 30
        DEBUG_LOG_LINES: 40
        DEBUG_LOG_EVERY_POLLS: 10
      run: go run "./$PERF_EVAL_DIR/relay"
    - name: Write relay summary
      if: always()
      shell: bash
      run: |
        if [ -f /tmp/results.md ]; then
          cat /tmp/results.md >> "$GITHUB_STEP_SUMMARY"
        elif [ -f /tmp/timeout-comment.md ]; then
          cat /tmp/timeout-comment.md >> "$GITHUB_STEP_SUMMARY"
        fi
